name: Execute ML lab notebooks

on:
  push:
    paths:
      - "Dataset/**"
      - "datasets/**"
      - "*.csv"
      - ".github/workflows/execute-notebooks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbconvert ipykernel

      - name: Execute notebooks when their datasets exist
        id: execute
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p executed-notebooks
          failures=0
          executed=0
          skipped=0

          while IFS= read -r notebook; do
            folder="$(basename "$(dirname "$notebook")")"
            case "$folder" in
              ex-01-exploratory-data-analysis) dataset="Dataset/titanic.csv" ;;
              ex-02-simple-linear-regression) dataset="Dataset/Salary.csv" ;;
              ex-03-multiple-linear-regression) dataset="Dataset/Housing.csv" ;;
              ex-04-polynomial-regression) dataset="Dataset/fish.csv" ;;
              ex-05-ridge-regression|ex-06-lasso-regression) dataset="Housing.csv" ;;
              ex-*) dataset="heart_disease_dataset.csv" ;;
              *) continue ;;
            esac

            if [[ ! -f "$dataset" ]]; then
              echo "SKIPPED: $notebook — missing dataset: $dataset"
              echo "- Skipped `$folder`: missing `$dataset`" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi

            output="${folder}.ipynb"
            echo "Executing $notebook (dataset: $dataset)"
            if jupyter nbconvert --to notebook --execute "$notebook" \
              --output "$output" --output-dir executed-notebooks \
              --ExecutePreprocessor.timeout=600; then
              cp "executed-notebooks/$output" "$notebook"
              echo "SUCCESS: $notebook"
              echo "- Passed: `$folder`" >> "$GITHUB_STEP_SUMMARY"
              executed=$((executed + 1))
            else
              echo "FAILED: $notebook"
              echo "- **Failed:** `$folder` (see job logs)" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
            fi
          done < <(find ex-* -maxdepth 1 -type f -name '*.ipynb' -print | sort)

          {
            echo ""
            echo "### Notebook execution summary"
            echo "- Executed successfully: $executed"
            echo "- Skipped (dataset missing): $skipped"
            echo "- Failed: $failures"
            echo "- Executed notebooks are uploaded as a workflow artifact when available."
          } >> "$GITHUB_STEP_SUMMARY"

          if (( executed == 0 )); then
            echo "No notebooks were executed. Upload the required datasets with the expected filenames and paths."
          fi
          if (( failures > 0 )); then
            exit 1
          fi

      - name: Commit executed notebooks with outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ex-*/*.ipynb
          if git diff --cached --quiet; then
            echo "No notebook output changes to commit."
          else
            git commit -m "Add executed notebook outputs"
            git push
          fi

      - name: Upload executed notebooks as downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-machine-learning-notebooks
          path: executed-notebooks/
          if-no-files-found: warn
          retention-days: 14
