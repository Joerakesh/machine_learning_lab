name: Execute ML lab notebooks

on:
  push:
    paths:
      - "Dataset/**"
      - "datasets/**"
      - "*.csv"
      - ".github/workflows/execute-notebooks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbconvert ipykernel

      - name: Execute notebooks and save outputs
        run: |
          set -e
          mkdir -p executed-notebooks
          for notebook in ex-*/*.ipynb; do
            echo "Executing $notebook"
            output="$(basename "$(dirname "$notebook")").ipynb"
            jupyter nbconvert --to notebook --execute "$notebook" --output "$output" --output-dir executed-notebooks --ExecutePreprocessor.timeout=600
            cp "executed-notebooks/$output" "$notebook"
          done

      - name: Commit notebooks with rendered outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ex-*/*.ipynb
          if git diff --cached --quiet; then
            echo "No notebook output changes to commit."
          else
            git commit -m "Add executed notebook outputs"
            git push
          fi

      - name: Upload executed notebooks as backup artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-machine-learning-notebooks
          path: executed-notebooks/
          if-no-files-found: warn
          retention-days: 14
