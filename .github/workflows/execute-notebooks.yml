name: Execute ML lab notebooks

on:
  push:
    paths:
      - "Dataset/**"
      - "datasets/**"
      - "*.csv"
      - ".github/workflows/python-checks.yml"
      - ".github/workflows/execute-notebooks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbconvert ipykernel

      - name: Prepare notebook execution output
        run: mkdir -p executed-notebooks

      - name: Execute notebooks
        run: |
          set -e
          for notebook in ex-*/*.ipynb; do
            echo "Executing $notebook"
            output="$(basename "$(dirname "$notebook")").ipynb"
            jupyter nbconvert --to notebook --execute "$notebook" --output "$output" --output-dir executed-notebooks --ExecutePreprocessor.timeout=600
          done

      - name: Upload executed notebooks with outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-machine-learning-notebooks
          path: executed-notebooks/
          if-no-files-found: warn
          retention-days: 14
